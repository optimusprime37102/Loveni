<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 660 460" width="660" height="460" role="img" aria-label="Loveni pink love letter icon with heart seal and pink sparkle rays">
  <title>Loveni Love Letter</title>
  <desc>Editable vector illustration of an open blush-pink envelope holding a love note, with a rose heart in front. Transparent background.</desc>
  <defs>
    <linearGradient id="paper" x1=".15" y1="0" x2=".85" y2="1" objectBoundingBox="true">
      <stop stop-color="#fff3f6"/>
      <stop offset=".52" stop-color="#ffe5ed"/>
      <stop offset="1" stop-color="#ffd6e4"/>
    </linearGradient>
    <linearGradient id="envelopeBack" x1="0" y1="0" x2=".9" y2="1" objectBoundingBox="true">
      <stop stop-color="#ffb6cb"/>
      <stop offset=".6" stop-color="#ff9fbb"/>
      <stop offset="1" stop-color="#f888a8"/>
    </linearGradient>
    <linearGradient id="leftFold" x1="0" y1="0" x2="1" y2=".7" objectBoundingBox="true">
      <stop stop-color="#ffc1d2"/>
      <stop offset="1" stop-color="#ffa1bb"/>
    </linearGradient>
    <linearGradient id="rightFold" x1=".1" y1="0" x2="1" y2="1" objectBoundingBox="true">
      <stop stop-color="#ffbad0"/>
      <stop offset="1" stop-color="#ff8dab"/>
    </linearGradient>
    <linearGradient id="frontFold" x1=".38" y1="0" x2=".5" y2="1" objectBoundingBox="true">
      <stop stop-color="#ffc1d4"/>
      <stop offset="1" stop-color="#ff9db8"/>
    </linearGradient>
    <linearGradient id="heart" x1=".2" y1=".05" x2=".85" y2="1" objectBoundingBox="true">
      <stop stop-color="#ff779c"/>
      <stop offset=".5" stop-color="#fa507f"/>
      <stop offset="1" stop-color="#e12e67"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0" y1="0" x2="1" y2="1" objectBoundingBox="true">
      <stop stop-color="#ff97b2"/><stop offset="1" stop-color="#f34e7e"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/>
      <feOffset in="b" dy="9" result="o"/>
      <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope=".19"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset in="b" dy="3" result="o"/>
      <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope=".13"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="heartShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/>
      <feOffset in="b" dy="4" result="o"/>
      <feComponentTransfer in="o" result="s"><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Three celebratory accent marks, separate vector strokes -->
  <g stroke="url(#sparkle)" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M465 63 L466 27"/>
    <path d="M503 80 L526 55"/>
    <path d="M522 117 L555 107"/>
  </g>

  <!-- Envelope and note are all editable paths. -->
  <g filter="url(#shadow)">
    <!-- Deep-pink inside of open envelope -->
    <path d="M111 139 Q118 132 129 134 L475 163 Q489 165 487 179 L457 359 Q456 371 444 370 L78 340 Q66 339 69 326 L99 152 Q101 144 111 139Z" fill="url(#envelopeBack)"/>
    <!-- A hint of back flap visible behind paper -->
    <path d="M111 146 L288 266 L482 173 Q486 168 475 163 L129 134 Q117 133 111 146Z" fill="#ef7f9f" opacity=".48"/>

    <!-- Love note with gentle clockwise rotation -->
    <g filter="url(#paperShadow)">
      <path d="M174 75 Q175 63 188 64 L439 87 Q450 88 448 101 L427 255 L151 232Z" fill="url(#paper)"/>
      <path d="M188 70 L439 92" stroke="#ffffff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
      <g stroke="#f5b1c6" stroke-opacity=".65" stroke-linecap="round" fill="none">
        <path d="M225 134 L388 148" stroke-width="12"/>
        <path d="M218 174 L365 187" stroke-width="11"/>
      </g>
    </g>

    <!-- Two triangular side folds -->
    <path d="M105 151 Q102 143 97 151 L69 325 Q67 339 78 340 L260 257Z" fill="url(#leftFold)"/>
    <path d="M482 173 Q487 170 486 181 L456 361 Q454 373 444 371 L286 264Z" fill="url(#rightFold)"/>

    <!-- Front envelope pocket: smooth V-shaped panel -->
    <path d="M69 325 L247 235 Q268 225 288 244 L457 358 Q458 370 446 371 L79 341 Q69 339 69 325Z" fill="url(#frontFold)"/>
    <path d="M75 334 L242 247" stroke="#ffd6e0" stroke-width="2.6" opacity=".32" stroke-linecap="round"/>
    <path d="M291 253 L451 364" stroke="#f77e9d" stroke-width="2.4" opacity=".18" stroke-linecap="round"/>

    <!-- Heart at meeting point of the flaps -->
    <path d="M267 285 C257 275 231 253 225 238 C216 215 234 199 252 205 C260 207 266 211 274 223 C283 213 291 210 302 212 C324 215 331 239 316 256 C303 272 282 288 274 292 Q271 294 267 285Z" fill="url(#heart)" filter="url(#heartShadow)"/>
    <path d="M244 214 Q253 209 261 219" stroke="#ffb5cb" opacity=".57" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
