<svg xmlns="http://www.w3.org/2000/svg" width="710" height="560" viewBox="56 14 355 280" fill="none" role="img" aria-label="Three overlapping pastel pink hearts">
  <defs>
    <linearGradient id="rearPink" x1="92" y1="37" x2="296" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF97B9"/>
      <stop offset="0.42" stop-color="#FFA9C4"/>
      <stop offset="0.77" stop-color="#FFD0DF"/>
      <stop offset="1" stop-color="#FDE7EF"/>
    </linearGradient>
    <linearGradient id="frontPink" x1="300" y1="67" x2="251" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB0C9"/>
      <stop offset="0.34" stop-color="#FFB9D0"/>
      <stop offset="0.72" stop-color="#FFD1E0"/>
      <stop offset="1" stop-color="#FFE2EC"/>
    </linearGradient>
    <linearGradient id="middleShine" x1="204" y1="111" x2="354" y2="267" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC4D9" stop-opacity="0.66"/>
      <stop offset="0.72" stop-color="#FFC5D8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFD5E3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="innerBlush" x1="231" y1="135" x2="305" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1F6"/>
      <stop offset="0.56" stop-color="#FFE9F1"/>
      <stop offset="1" stop-color="#FFE4EF"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="230" y1="226" x2="230" y2="332" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1F6" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFF1F6" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <g transform="scale(1 0.86)">
  <!-- Large heart behind, with a high left lobe -->
  <path d="M266 124 C243 80 215 28 153 27 C98 24 66 70 71 128 C76 189 128 241 191 290 C217 311 242 332 259 335 C268 336 276 330 289 321 C360 270 402 212 401 153 C401 106 379 75 348 68 C309 58 284 83 266 124 Z" fill="url(#rearPink)"/>
  <!-- Smaller heart in the foreground, shifted to the right: its left lobe overlaps the large heart -->
  <path d="M268 138 C245 102 215 92 190 94 C155 98 139 124 144 160 C150 204 197 255 249 306 C260 317 266 326 276 324 C288 320 311 299 339 270 C373 236 397 198 395 154 C393 112 368 80 332 78 C305 76 285 96 268 138 Z" fill="url(#frontPink)"/>
  <!-- Subtle sculpted highlight to bring out the layered left lobe -->
  <path d="M267 139 C246 104 216 95 190 98 C157 102 147 129 151 159 C158 201 204 253 255 305 C266 315 269 320 275 320 C243 284 194 231 177 192 C157 145 185 104 224 111 C241 115 257 128 267 139 Z" fill="url(#middleShine)"/>
  <!-- Pale inner heart nested in the right-hand heart -->
  <path d="M268 175 C255 152 234 140 216 142 C196 144 183 162 188 184 C195 212 229 242 260 265 C266 270 272 270 279 265 C313 239 345 207 348 181 C350 156 332 140 313 140 C294 140 279 156 268 175 Z" fill="url(#innerBlush)"/>
  <!-- Gentle bottom wash, transparent outside the heart silhouette -->
  <path d="M266 124 C243 80 215 28 153 27 C98 24 66 70 71 128 C76 189 128 241 191 290 C217 311 242 332 259 335 C268 336 276 330 289 321 C360 270 402 212 401 153 C401 106 379 75 348 68 C309 58 284 83 266 124 Z" fill="url(#bottomFade)"/>
  </g>
</svg>
