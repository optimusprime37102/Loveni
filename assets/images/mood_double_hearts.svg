<svg xmlns="http://www.w3.org/2000/svg" width="472" height="304" viewBox="0 0 118 76" fill="none">
  <defs>
    <linearGradient id="largePink" x1="38" y1="13" x2="50" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFABC4"/>
      <stop offset="0.36" stop-color="#FA8EAD"/>
      <stop offset="0.72" stop-color="#F66F98"/>
      <stop offset="1" stop-color="#F34F82"/>
    </linearGradient>
    <radialGradient id="largeLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(35 20) rotate(60) scale(33 35)">
      <stop stop-color="#FFF0F4" stop-opacity=".32"/>
      <stop offset="1" stop-color="#FFD0DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smallPink" x1="70" y1="22" x2="74" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD7E2"/>
      <stop offset="0.32" stop-color="#FFC1D3"/>
      <stop offset="0.7" stop-color="#FFA8C0"/>
      <stop offset="1" stop-color="#F78CAC"/>
    </linearGradient>
    <radialGradient id="smallLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(63 29) rotate(55) scale(30 31)">
      <stop stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFF1F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spark" x1="99" y1="13" x2="108" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6694"/>
      <stop offset="1" stop-color="#F44E83"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feOffset in="blur" dx="0" dy="2.3" result="shift"/>
      <feColorMatrix in="shift" type="matrix" values="0 0 0 0 0.82 0 0 0 0 0.31 0 0 0 0 0.52 0 0 0 .20 0" result="shadowColor"/>
      <feMerge><feMergeNode in="shadowColor"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="overlapShadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
    <filter id="softStrokes" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".22"/>
    </filter>
    <path id="leftHeart" d="M49 63C38 61 28 56 20 49C12 42 10 35 14 29C19 21 29 21 37 28C37 19 43 12 51 12C61 10 69 18 67 28C66 43 56 55 49 63Z"/>
    <path id="rightHeart" d="M65.0 65.8C57.3 60.2 53.5 53.1 52.5 44.5 51.4 35.8 54.9 25.9 62.8 22.6 68.8 20.1 73.5 23.8 76.7 29.9 82.4 25.4 89.3 26.6 93.4 32.1 101.2 42.5 92.0 55.7 81.5 60.8 75.6 63.7 69.3 66.7 65.0 65.8Z"/>
  </defs>

  <!-- Large heart behind, positioned to the left and higher -->
  <g filter="url(#shadow)">
    <use href="#leftHeart" fill="url(#largePink)"/>
    <use href="#leftHeart" fill="url(#largeLight)"/>
  </g>

  <!-- Smaller soft-pink heart in front to the lower right -->
  <g filter="url(#shadow)">
    <use href="#rightHeart" fill="url(#smallPink)"/>
    <use href="#rightHeart" fill="url(#smallLight)"/>
  </g>

  <!-- Three short, rosy excitement strokes from the original -->
  <g stroke="url(#spark)" stroke-width="2.8" stroke-linecap="round" filter="url(#softStrokes)">
    <path d="M94.3 13.6L94.0 20.1"/>
    <path d="M104.4 17.4L99.7 22.3"/>
    <path d="M107.8 29.0L102.3 29.2"/>
  </g>
</svg>
