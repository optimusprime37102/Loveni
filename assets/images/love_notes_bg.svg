<svg xmlns="http://www.w3.org/2000/svg" width="888" height="1720" viewBox="0 0 222 430" fill="none" aria-label="Loveni notes screen background only: pastel blush gradient, decorative hearts and curved floral waves">
  <defs>
    <linearGradient id="screenBg" x1="24" y1="0" x2="198" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9FA"/>
      <stop offset=".21" stop-color="#FFF1F5"/>
      <stop offset=".52" stop-color="#FDEEF3"/>
      <stop offset=".79" stop-color="#FFF3F6"/>
      <stop offset="1" stop-color="#FBE0EA"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientTransform="translate(140 65) rotate(90) scale(110 123)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDFE" stop-opacity=".90"/>
      <stop offset="1" stop-color="#FFFDFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientTransform="translate(107 260) rotate(90) scale(230 137)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".50"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBlush" x1="167" y1="0" x2="222" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD8E6"/>
      <stop offset="1" stop-color="#FDCBDF"/>
    </linearGradient>
    <linearGradient id="heroHeart" x1="120" y1="65" x2="155" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFAFCC"/>
      <stop offset=".55" stop-color="#FFC2D7"/>
      <stop offset="1" stop-color="#FFD3E2"/>
    </linearGradient>
    <linearGradient id="secondHeart" x1="146" y1="72" x2="178" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFAACC"/>
      <stop offset="1" stop-color="#FCD1E1"/>
    </linearGradient>
    <linearGradient id="backWave" x1="111" y1="386" x2="111" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE8F0"/>
      <stop offset="1" stop-color="#FFD4E2"/>
    </linearGradient>
    <linearGradient id="midWave" x1="110" y1="394" x2="110" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCFE2" stop-opacity=".68"/>
      <stop offset="1" stop-color="#FFA8C8" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="frontWave" x1="111" y1="404" x2="111" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCB7D0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#F88CB4" stop-opacity=".93"/>
    </linearGradient>
    <linearGradient id="leafTone" x1="0" y1="0" x2="29" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB1CE"/>
      <stop offset="1" stop-color="#F577A6"/>
    </linearGradient>
    <g id="heart">
      <path d="M0 13 C0 4 7 -1 15 -1 C22 -1 27 4 31 9 C35 4 41 -1 48 -1 C57 -1 63 5 63 14 C63 27 51 37 31 52 C12 37 0 27 0 13Z"/>
    </g>
    <g id="botanicalSprig">
      <path d="M2 65 C2 42 12 26 21 11 M6 51 C11 40 22 36 32 33 M7 51 C5 42 1 37 -3 33" stroke="#F889B0" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M15 26 C15 15 20 7 26 1 C34 13 27 22 19 27Z" fill="url(#leafTone)"/>
      <path d="M9 43 C14 33 23 31 31 29 C30 39 21 45 9 43Z" fill="#FA94B7"/>
      <path d="M6 50 C3 43 -1 42 -5 39 C-7 48 -2 54 6 55Z" fill="#FFA4C4"/>
      <path d="M16 39 C20 30 26 25 34 23 C36 33 27 38 16 39Z" fill="#FFABC9"/>
      <path d="M3 61 C6 54 12 50 22 49 C21 58 12 63 3 61Z" fill="#F789B0"/>
      <path d="M3 62 C0 56 -5 53 -9 53 C-7 62 -2 65 3 66Z" fill="#F67BA8"/>
    </g>
  </defs>

  <!-- Background canvas, no card or panel -->
  <rect width="222" height="430" fill="url(#screenBg)"/>
  <rect width="222" height="430" fill="url(#centerGlow)"/>
  <rect width="222" height="200" fill="url(#topGlow)"/>

  <!-- Soft top-right sweep like the reference -->
  <path d="M151 -1 C170 18 190 29 205 39 C214 47 219 55 222 66 L222 -1 Z" fill="url(#topBlush)" opacity=".55"/>
  <path d="M180 -1 C195 11 210 19 222 27 L222 -1 Z" fill="#FFC5DB" opacity=".34"/>

  <!-- Left curling ribbons behind the top decorative hearts -->
  <path d="M0 75 C22 76 43 84 62 96 C37 91 19 92 0 105 Z" fill="#F9C6DA" opacity=".62"/>
  <path d="M0 85 C21 85 39 91 57 100 C29 102 18 109 0 114 Z" fill="#FFB6D1" opacity=".34"/>

  <!-- Same layered, partly hidden heart cluster above the notes region -->
  <g opacity=".76">
    <g transform="translate(117 65) scale(.52)"><use href="#heart" fill="url(#heroHeart)"/></g>
    <g transform="translate(146 73) scale(.40)"><use href="#heart" fill="url(#secondHeart)"/></g>
    <g transform="translate(142 83) scale(.28)"><use href="#heart" fill="#FFF0F6"/></g>
    <path d="M113 88 C118 77 126 75 134 83" stroke="#FFD3E4" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    <path d="M165 92 C175 82 191 91 204 104" stroke="#FCD9E7" stroke-width="11" stroke-linecap="round" opacity=".32"/>
  </g>

  <!-- Lower flowing hills: curve rises at each edge, shallow valley center -->
  <path d="M0 406 C20 388 39 388 60 399 C89 415 103 421 123 418 C156 415 181 391 205 395 C212 395 218 399 222 404 L222 430 L0 430Z" fill="url(#backWave)" opacity=".96"/>
  <path d="M0 414 C29 400 41 406 65 417 C90 428 117 430 144 419 C170 408 196 401 222 407 L222 430 L0 430Z" fill="url(#midWave)" opacity=".70"/>
  <path d="M0 420 C26 409 40 415 64 423 C93 435 118 434 147 425 C178 415 202 409 222 415 L222 430 L0 430Z" fill="url(#frontWave)" opacity=".8"/>
  <path d="M0 427 C29 419 48 425 79 428 C110 432 142 430 168 426 C191 422 208 422 222 423 L222 430 L0 430Z" fill="#FFD9E7" opacity=".6"/>

  <!-- floral sprigs at the lower left and right edges -->
  <g transform="translate(10 389) scale(.60)"><use href="#botanicalSprig"/></g>
  <g transform="translate(212 389) scale(-.60 .60)"><use href="#botanicalSprig"/></g>
</svg>
